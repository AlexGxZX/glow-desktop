# Автотесты при каждом push и pull request.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Юнит-тесты
        run: npm test
      - name: Браузер для сквозных тестов
        run: npx playwright install --with-deps chromium
      - name: Сквозные тесты
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/shots
